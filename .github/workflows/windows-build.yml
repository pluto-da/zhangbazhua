name: Custom Windows build
on:
  push:
    branches: [beeftv-windows-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select bundled Node runtime
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p=require("path"); const bin=p.dirname(process.execPath); fs.appendFileSync(process.env.GITHUB_ENV, `BEEFTV_NODE_RUNTIME=${process.platform==="win32"?bin:p.dirname(bin)}\n`);'
      - name: Windows compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils
      - name: Select Windows compiler and NSIS
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Build Windows desktop
        env:
          CGO_ENABLED: '1'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-beeftv-windows-release.ps1
      - name: Package native installer
        shell: bash
        run: python scripts/package-desktop-installer.py --platform windows-amd64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BeefTV-custom-windows
          path: dist/ZhangBaZhua-*
          retention-days: 14
          if-no-files-found: warn
